# 상위 성장기 디지몬 진화 라인 (한글명 기준)
#
# 대상 선정: docs/popular-digimon-100.yaml 의 성장기(child) 상위권
#   + sprites/packs/ 에 이미 존재하는 팩 전체 (케라몬 포함, 100위권 밖이라 rank: null)
#
# 출처: namu.wiki 각 디지몬 문서의 진화도 표 (문서별 URL은 항목의 source 필드)
# 조회일: 2026-07-31
#
# 단계 키는 프로젝트 evolution-tree.json 의 stage id 와 맞췄다.
#   baby1 / baby2  → evolution-tree.json 의 baby 한 단계로 합쳐진다 (원작은 유아기 2단계)
#   child → adult → perfect → ultimate → superultimate
#   armor  = 아머체. 정규 세대 진화가 아니라 디지멘탈을 쓰는 분기이므로 별도 필드.
#   jogress = 다른 라인과의 합체 진화. 소속 라인이 모호해 별도 필드로 뺐다.
#
# 값이 null 인 단계 = 공식 설정이 존재하지 않거나 문서에 기재되지 않음 (추측으로 채우지 않았다).

