  kyubimon: 구미호몬
  machgaogamon: 마하가오가몬
  megagargomon: 세인트가르고몬
  metalgarurumon: 메탈가루몬
  metalgreymon: 메탈그레이몬(백신종)
  miragegaogamon: 미라지가오가몬
  miragegaogamon_bm: 미라지가오가몬 버스트 모드
  omegamon: 오메가몬
  paildramon: 파일드라몬
