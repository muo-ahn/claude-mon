  wanyamon: 와냐몬
  wargreymon: 워그레이몬
  wargrowlmon: 메가로그라우몬
  weregarurumon: 워가루몬
  yatagaramon: 야타가라몬

# 카탈로그(정규 138종) 밖이지만 에셋이 존재하는 종.
# 팩 오리지널 분기·아머체·악역 등. 경고 대상이 아니라 extras 로 집계한다.
out_of_catalog:
  블랙워그레이몬: 팩 확장 분기 (아구몬 궁극체 분기)
  다크드라몬: 팩 확장 분기 (파피몬 궁극체 분기)
  라이즈그레이몬: 팩 확장 분기 (지오그레이몬 계열 완전체)
  지오그레이몬: 팩 확장 분기 (아구몬 성숙기 분기)
  블랙메가로그라우몬: 팩 확장 분기 (길몬 완전체 분기)
  뱀파이몬: 팩 확장 분기 (임프몬 완전체 자리 대체)
  크로노몬 홀리 모드: 팩 확장 분기 (팔코몬 초궁극체)
  매그너몬: 아머체 (브이몬)
  화염드라몬: 아머체 (브이몬)
  블랙래피드몬: 팩 확장 분기 (테리어몬 완전체 분기)
  블랙워가루몬: 팩 확장 분기 (파피몬 완전체 분기)
  카오스듀크몬: 팩 확장 분기 (길몬 궁극체 분기)
  레이브몬 버스트 모드: 팩 확장 분기 (팔코몬 초궁극체 분기)
  세이버레오몬: 카탈로그 외 (인기 랭킹 69위)
  이블몬: 카탈로그 외 (임프몬 성숙기 분기, DWDS Line 1)
  미이라몬: 카탈로그 외 (임프몬 완전체 분기, DWDS Line 1)
  데스몬: 카탈로그 외 (임프몬 궁극체 분기, DWDS Line 1 — 영칭 Ghoulmon)
  # Wikimon 에 Korean 표기가 없다. 데스몬(黒) 색교체 변종이고 Wikimon 이
  # 데스몬 → 데스몬(블랙) 진화를 명시하므로 시트 영칭(Ghoulmon Black)을
  # 그대로 옮긴 표기를 쓴다.
  데스몬 블랙: 카탈로그 외 (임프몬 초궁극체 분기)
  푸치몬: 카탈로그 외 (천사형 유아기)
  샤인그레이몬: 카탈로그 외 (세이버즈 아구몬(2006) 계열)
  샤인그레이몬 버스트 모드: 카탈로그 외 (인기 랭킹 47위)
  알: 디지타마 (라인 무관 공용)

